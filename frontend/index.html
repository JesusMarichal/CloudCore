<!doctype html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- ── Primary SEO ── -->
  <title>CloudCore — Gestiona tu infraestructura cloud desde un solo lugar</title>
  <meta name="description" content="CloudCore es una plataforma SaaS para gestionar servidores VPS, desplegar sitios web, WordPress, bases de datos MySQL/PostgreSQL y terminales SSH desde un panel profesional." />
  <meta name="keywords" content="cloudcore, hosting VPS, WordPress hosting, servidor cloud, base de datos, SSH, panel de control, infraestructura SaaS, despliegue web, AbstracDev" />
  <meta name="author" content="AbstracDev" />
  <meta name="robots" content="index, follow" />
  <meta name="theme-color" content="#0d1117" />
  <link rel="canonical" href="https://cloudcore.lat/home" />

  <!-- ── Open Graph (Facebook / LinkedIn) ── -->
  <meta property="og:type"        content="website" />
  <meta property="og:url"         content="https://cloudcore.lat" />
  <meta property="og:title"       content="CloudCore — Infraestructura SaaS todo en uno" />
  <meta property="og:description" content="Despliega servidores, sitios web, WordPress y bases de datos con una interfaz profesional y en tiempo real. Desarrollado por AbstracDev." />
  <meta property="og:image"       content="https://cloudcore.lat/og-image.png" />
  <meta property="og:locale"      content="es_ES" />
  <meta property="og:site_name"   content="CloudCore" />

  <!-- ── Twitter Card ── -->
  <meta name="twitter:card"        content="summary_large_image" />
  <meta name="twitter:title"       content="CloudCore — Infraestructura SaaS" />
  <meta name="twitter:description" content="Gestiona servidores, sitios web, WordPress y bases de datos desde un solo panel." />
  <meta name="twitter:image"       content="https://cloudcore.lat/og-image.png" />

  <!-- ── Security (meta-level) ── -->
  <meta name="referrer" content="strict-origin-when-cross-origin" />
  <meta http-equiv="X-Content-Type-Options" content="nosniff" />
  <!-- Paddle.js se descarga de cdn.paddle.com y el checkout se pinta en un
       iframe de buy.paddle.com / create-checkout.paddle.com (y sus variantes
       sandbox-*). Sin esas entradas initializePaddle() falla con
       "Failed to load Paddle.js" y el overlay no llega a abrirse. -->
  <meta http-equiv="Content-Security-Policy"
        content="
          default-src 'self';
          script-src  'self' 'unsafe-inline' 'unsafe-eval' https://*.paddle.com;
          style-src   'self' 'unsafe-inline' https://fonts.googleapis.com;
          font-src    'self' https://fonts.gstatic.com;
          img-src     'self' data: https: http://localhost:*;
          connect-src 'self' http: https: ws: wss:;
          frame-src   https://*.paddle.com;
          frame-ancestors 'none';
        " />

  <!-- ── Favicon ── -->
  <link rel="icon" type="image/png" href="/favicon.png" />
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
